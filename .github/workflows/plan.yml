name: Terraform plan
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terraform-state-dev
  cancel-in-progress: false
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: 'true'
      TG_NON_INTERACTIVE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '283678155577'
          retry-max-attempts: 3
          role-session-name: plan-${{ github.run_id }}
      - run: bash scripts/plan.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ github.run_id }}
          path: plan.txt
          retention-days: 3
      - name: Update PR plan comment
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            const body = marker + '\n### Terraform plan\n```text\n' + fs.readFileSync('plan.txt', 'utf8').slice(-50000) + '\n```\nEstimated EC2 + disk cost: ~$6.77/month, plus usage-based S3 storage/requests. The deployment workflow creates a fresh plan on main.';
            const params = {owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number};
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({...params, comment_id: existing.id, body});
            else await github.rest.issues.createComment({...params, body});
