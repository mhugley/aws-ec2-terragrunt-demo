name: Terraform plan
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terraform-state-dev
  cancel-in-progress: false
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: 'true'
      TG_NON_INTERACTIVE: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '283678155577'
          retry-max-attempts: 3
          role-session-name: plan-${{ github.run_id }}
      - run: bash scripts/plan.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: plan-${{ github.run_id }}
          path: plan.txt
          retention-days: 3
      - name: Update PR plan comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            const body = marker + '\n### Terraform plan\n```text\n' + fs.readFileSync('plan.txt', 'utf8').slice(-50000) + '\n```\nEstimated EC2 + disk cost: ~$6.77/month. The deployment workflow creates a fresh plan on main.';
            const params = {owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number};
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({...params, comment_id: existing.id, body});
            else await github.rest.issues.createComment({...params, body});
