name: Drift detection
on:
  schedule:
    - cron: '23 13 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terraform-state-dev
  cancel-in-progress: false
jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: 'true'
      TG_NON_INTERACTIVE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '283678155577'
      - name: Detect drift without changing infrastructure
        id: detect
        working-directory: live/dev/ec2
        run: |
          terragrunt init -input=false -lockfile=readonly
          set +e
          terragrunt plan -input=false -no-color -detailed-exitcode -lock-timeout=5m > "$RUNNER_TEMP/drift.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/drift.txt" >> "$GITHUB_STEP_SUMMARY"
          [[ $status != 1 ]] || exit 1
          echo "changes=$status" >> "$GITHUB_OUTPUT"
      - name: Create or resolve drift issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHANGES: ${{ steps.detect.outputs.changes }}
        with:
          script: |
            const params = {owner: context.repo.owner, repo: context.repo.repo};
            const title = 'Infrastructure drift detected';
            const issues = await github.paginate(github.rest.issues.listForRepo, {...params, state: 'open', labels: 'drift'});
            const existing = issues.find(i => i.title === title && !i.pull_request);
            if (process.env.CHANGES === '2' && !existing) {
              await github.rest.issues.create({...params, title, labels: ['drift'], body: `Terraform detected changes. Review the [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) and use Deploy EC2 to reconcile. No automatic apply was performed.`});
            } else if (process.env.CHANGES === '0' && existing) {
              await github.rest.issues.update({...params, issue_number: existing.number, state: 'closed'});
            }
      - name: Fail if drift exists
        if: steps.detect.outputs.changes == '2'
        run: exit 1
